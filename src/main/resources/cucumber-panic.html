<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Cucumber Panic</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #bfe6ff; touch-action: none; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<script>
(function () {
  'use strict';

  // ---- constants -----------------------------------------------------------
  var W = 800, H = 600;             // fixed logical size of the play field
  var MAX_DT = 0.05;                // clamp for the frame delta, in seconds
  var CAT_SPEED = 400;              // px per second, constant
  var CAT_W = 60, CAT_H = 44;
  var CAT_Y = H - 30;               // baseline (feet) of the cat
  var START_LIVES = 3;
  var IMMUNITY = 1;                 // seconds of cucumber immunity after a hit
  var FISH_INTERVAL = 3;            // seconds of play time between fish
  var FISH_SPEED = 150;             // px per second, constant
  var FISH_POINTS = 10;
  var CUC_W = 18, CUC_H = 44;       // cucumber box (centred on x, y)
  var FISH_W = 34, FISH_H = 20;     // fish box (centred on x, y)
  var SPAWN_MARGIN = 30;
  var EPS = 1e-9;
  var rand = Math.random;           // replaceable through the test handle
  var BUBBLE_TIME = 2;              // seconds the speech bubble stays
  var STORAGE_KEY = 'cucumberPanicBest';
  var MUTE_BTN = { x: W - 56, y: 12, w: 44, h: 44 };
  var LINES = [
    'Not the cucumber!',
    'Eeek! Get it away!',
    'Is that a snake?!',
    'I am too pretty for this!',
    'Nope nope nope!',
    'Why is it always cucumbers?!',
    'Meowch! Rude!'
  ];


  // ---- state ---------------------------------------------------------------
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');

  var state = {
    phase: 'start',                 // start | play | over
    score: 0,
    best: 0,
    muted: false,
    bubbleText: '',
    bubbleTimer: 0,                 // seconds of speech bubble left
    lives: START_LIVES,
    cucumbers: [],                  // {x, y}
    fish: [],                       // {x, y}
    immune: 0,                      // seconds of immunity left
    spawnAcc: 0,                    // cucumber spawn accumulator
    fishTimer: 0,                   // seconds since the last fish
    fishSpawned: 0,                 // fish spawned this game


    cat: { x: W / 2, y: CAT_Y, w: CAT_W, h: CAT_H, dir: 0, facing: 1 }
  };
  var keys = { left: false, right: false };
  var pointerDir = 0;               // -1 left half, +1 right half, 0 none
  var view = { scale: 1, cssW: W, cssH: H };
  var soundLog = [];                // names of sounds requested while unmuted (test aid)

  // ---- best score storage (falls back to memory when storage throws) ------------
  function loadBest() {
    try {
      var v = parseInt(window.localStorage.getItem(STORAGE_KEY), 10);
      return isNaN(v) ? 0 : v;
    } catch (e) { return state.best; }
  }
  function saveBest(v) {
    try { window.localStorage.setItem(STORAGE_KEY, String(v)); } catch (e) { /* session only */ }
  }
  state.best = loadBest();

  // ---- sound (Web Audio, created lazily on a user gesture) -----------------------
  var actx = null;
  function audioCtx() {
    if (actx) return actx;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    } catch (e) { actx = null; }
    return actx;
  }
  function sweep(f0, f1, dur, type, vol) {
    var a = audioCtx();
    if (!a) return;
    try {
      var t = a.currentTime, o = a.createOscillator(), g = a.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) { /* audio unavailable */ }
  }
  function play(name) {
    if (state.muted) return;
    soundLog.push(name);
    if (name === 'shriek') sweep(900, 1800, 0.35, 'sawtooth', 0.25);
    else if (name === 'fish') sweep(600, 1200, 0.15, 'square', 0.15);
    else if (name === 'gameover') sweep(400, 80, 0.8, 'triangle', 0.25);
  }
  function toggleMute() { state.muted = !state.muted; }


  // ---- scaling -------------------------------------------------------------
  function resize() {
    var iw = window.innerWidth || W, ih = window.innerHeight || H;
    var scale = Math.min(iw / W, ih / H);
    view.scale = scale;
    view.cssW = Math.floor(W * scale);
    view.cssH = Math.floor(H * scale);
    canvas.style.width = view.cssW + 'px';
    canvas.style.height = view.cssH + 'px';
  }

  // client (pointer) coordinates -> logical 800x600 coordinates
  function toLogical(clientX, clientY) {
    var r = canvas.getBoundingClientRect();
    var rw = r.width || view.cssW, rh = r.height || view.cssH;
    return { x: (clientX - r.left) * W / rw, y: (clientY - r.top) * H / rh };
  }

  // ---- phase machine -------------------------------------------------------
  function startGame() {
    state.score = 0;
    state.lives = START_LIVES;
    state.cucumbers.length = 0;
    state.fish.length = 0;
    state.immune = 0;
    state.spawnAcc = 0;
    state.fishTimer = 0;
    state.fishSpawned = 0;
    state.bubbleTimer = 0;
    state.cat.x = W / 2;
    state.cat.dir = 0;
    state.phase = 'play';
  }

  function advancePhase() {
    if (state.phase === 'start' || state.phase === 'over') startGame();
  }

  function togglePause() {
    if (state.phase === 'play') { state.phase = 'paused'; state.cat.dir = 0; }
    else if (state.phase === 'paused') state.phase = 'play';
  }
  function autoPause() { if (state.phase === 'play') togglePause(); }

  // ---- update --------------------------------------------------------------
  function clampCat() {
    var half = state.cat.w / 2;
    if (state.cat.x < half) state.cat.x = half;
    if (state.cat.x > W - half) state.cat.x = W - half;
  }

  function currentDir() {
    var d = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    return d !== 0 ? d : pointerDir;
  }

  // Pure difficulty: spawn rate (per second) and fall speed (px/s) from the score.
  function difficulty(score) {
    var level = Math.floor(score / 100);
    return {
      level: level,
      spawnRate: Math.min(5, 1 + level),
      fallSpeed: Math.min(500, 200 + 100 * level)
    };
  }

  function spawnX() { return SPAWN_MARGIN + rand() * (W - 2 * SPAWN_MARGIN); }

  function overlapsCat(o, w, h) {
    var c = state.cat;
    return Math.abs(o.x - c.x) < (w + c.w) / 2 && Math.abs(o.y - (c.y - c.h / 2)) < (h + c.h) / 2;
  }

  function gameOver() {
    state.phase = 'over';
    state.cat.dir = 0;
    if (state.score > state.best) { state.best = state.score; saveBest(state.best); }
    play('gameover');
  }

  // A life is lost: immunity, speech bubble, shriek; game over at 0 lives.
  function loseLife() {
    state.lives -= 1;
    state.immune = IMMUNITY;
    state.bubbleText = LINES[Math.floor(rand() * LINES.length) % LINES.length];
    state.bubbleTimer = BUBBLE_TIME;
    play('shriek');
    if (state.lives <= 0) { state.lives = 0; gameOver(); }
  }

  function step(dt) {
    if (state.phase !== 'play') return;
    var d = currentDir();
    state.cat.dir = d;
    if (d !== 0) state.cat.facing = d;
    state.cat.x += d * CAT_SPEED * dt;
    clampCat();

    var i, o, diff = difficulty(state.score);
    if (state.immune > 0) state.immune = Math.max(0, state.immune - dt);
    if (state.bubbleTimer > 0) state.bubbleTimer = Math.max(0, state.bubbleTimer - dt);


    // spawning
    state.spawnAcc += diff.spawnRate * dt;
    while (state.spawnAcc >= 1 - EPS) {
      state.spawnAcc -= 1;
      state.cucumbers.push({ x: spawnX(), y: -CUC_H });
    }
    state.fishTimer += dt;
    while (state.fishTimer >= FISH_INTERVAL - EPS) {
      state.fishTimer -= FISH_INTERVAL;
      state.fish.push({ x: spawnX(), y: -FISH_H });
      state.fishSpawned += 1;
    }

    // cucumbers: fall, collide, drop off the bottom
    var keepC = [];
    for (i = 0; i < state.cucumbers.length; i++) {
      o = state.cucumbers[i];
      o.y += diff.fallSpeed * dt;
      if (state.phase === 'play' && overlapsCat(o, CUC_W, CUC_H)) {
        if (state.immune <= 0) loseLife();
        continue;                   // a touching cucumber is always removed
      }
      if (o.y - CUC_H / 2 < H) keepC.push(o);
    }
    state.cucumbers = keepC;

    // fish: fall at constant speed, score on touch, vanish silently at the bottom
    var keepF = [];
    for (i = 0; i < state.fish.length; i++) {
      o = state.fish[i];
      o.y += FISH_SPEED * dt;
      if (state.phase === 'play' && overlapsCat(o, FISH_W, FISH_H)) {
        state.score += FISH_POINTS;
        play('fish');
        continue;
      }
      if (o.y - FISH_H / 2 < H) keepF.push(o);
    }
    state.fish = keepF;
  }

  // ---- drawing -------------------------------------------------------------
  function drawCat(c) {
    var x = c.x, y = c.y, f = c.facing;
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = '#f0a040';
    // tail
    ctx.beginPath(); ctx.ellipse(-f * 28, -22, 6, 16, -f * 0.5, 0, Math.PI * 2); ctx.fill();
    // body
    ctx.beginPath(); ctx.ellipse(0, -16, 26, 16, 0, 0, Math.PI * 2); ctx.fill();
    // head
    ctx.beginPath(); ctx.arc(f * 16, -32, 13, 0, Math.PI * 2); ctx.fill();
    // ears
    ctx.beginPath();
    ctx.moveTo(f * 6, -41); ctx.lineTo(f * 8, -54); ctx.lineTo(f * 15, -43);
    ctx.moveTo(f * 18, -43); ctx.lineTo(f * 25, -54); ctx.lineTo(f * 27, -39);
    ctx.fill();
    // eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(f * 11, -34, 4, 0, Math.PI * 2); ctx.arc(f * 22, -34, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(f * 12, -34, 1.8, 0, Math.PI * 2); ctx.arc(f * 23, -34, 1.8, 0, Math.PI * 2); ctx.fill();
    // legs
    ctx.fillStyle = '#d98a2a';
    ctx.fillRect(-18, -6, 8, 6); ctx.fillRect(10, -6, 8, 6);
    ctx.restore();
  }

  function text(str, x, y, size, color) {
    ctx.fillStyle = color;
    ctx.font = 'bold ' + size + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(str, x, y);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#bfe6ff';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#7ccf6b';
    ctx.fillRect(0, H - 30, W, 30);

    var i, o;
    ctx.fillStyle = '#3f9a3a';
    for (i = 0; i < state.cucumbers.length; i++) {
      o = state.cucumbers[i];
      ctx.fillRect(o.x - CUC_W / 2, o.y - CUC_H / 2, CUC_W, CUC_H);
    }
    ctx.fillStyle = '#4aa3e0';
    for (i = 0; i < state.fish.length; i++) {
      o = state.fish[i];
      ctx.beginPath(); ctx.ellipse(o.x, o.y, FISH_W / 2 - 4, FISH_H / 2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(o.x + FISH_W / 2 - 6, o.y); ctx.lineTo(o.x + FISH_W / 2 + 2, o.y - 8);
      ctx.lineTo(o.x + FISH_W / 2 + 2, o.y + 8); ctx.fill();
    }

    if (state.immune > 0) ctx.globalAlpha = Math.floor(state.immune * 10) % 2 ? 0.4 : 1;
    drawCat(state.cat);
    ctx.globalAlpha = 1;

    // speech bubble
    if (state.bubbleTimer > 0 && state.phase !== 'start') {
      var bx = Math.min(W - 130, Math.max(130, state.cat.x)), by = state.cat.y - 80;
      ctx.fillStyle = '#fff';
      ctx.fillRect(bx - 120, by - 34, 240, 34);
      ctx.beginPath(); ctx.moveTo(bx - 8, by); ctx.lineTo(bx + 8, by); ctx.lineTo(bx, by + 12); ctx.fill();
      text(state.bubbleText, bx, by - 11, 18, '#222');
    }

    // mute button (drawn and hit-tested on the canvas)
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(MUTE_BTN.x, MUTE_BTN.y, MUTE_BTN.w, MUTE_BTN.h);
    text(state.muted ? 'OFF' : 'SND', MUTE_BTN.x + MUTE_BTN.w / 2, MUTE_BTN.y + 27, 14, '#fff');

    if (state.phase === 'play' || state.phase === 'paused' || state.phase === 'over') {
      ctx.textAlign = 'left';
      ctx.fillStyle = '#222';
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText('Score: ' + state.score, 16, 32);
      ctx.fillText('Lives: ' + state.lives, 16, 60);
    }
    if (state.phase === 'paused') {
      ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
      text('Paused', W / 2, 280, 56, '#fff');
      text('Press P or Esc to resume', W / 2, 330, 24, '#fff');
    }
    if (state.phase === 'start') {
      ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
      text('Cucumber Panic', W / 2, 220, 64, '#9be26a');
      text('Press Space or tap to start', W / 2, 300, 28, '#fff');
      text('Best: ' + state.best, W / 2, 350, 22, '#fff');
    } else if (state.phase === 'over') {
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
      text('Game Over', W / 2, 200, 60, '#ff7a7a');
      text('Score: ' + state.score, W / 2, 270, 30, '#fff');
      text('Best: ' + state.best, W / 2, 315, 30, '#fff');
      text('Press Space or tap to restart', W / 2, 380, 26, '#fff');
    }
  }

  // ---- input ---------------------------------------------------------------
  function keyName(e) {
    var k = e.key || '';
    return k.length === 1 ? k.toLowerCase() : k;
  }

  window.addEventListener('keydown', function (e) {
    var k = keyName(e);
    if (k === 'ArrowLeft' || k === 'a') keys.left = true;
    else if (k === 'ArrowRight' || k === 'd') keys.right = true;
    else if (k === ' ' || k === 'Spacebar') advancePhase();
    else if (k === 'p' || k === 'Escape') { if (!e.repeat) togglePause(); }
    else if (k === 'm') { if (!e.repeat) toggleMute(); }
    else return;
    if (e.preventDefault) e.preventDefault();
  });
  window.addEventListener('keyup', function (e) {
    var k = keyName(e);
    if (k === 'ArrowLeft' || k === 'a') keys.left = false;
    else if (k === 'ArrowRight' || k === 'd') keys.right = false;
  });

  function pointerFrom(e) {
    pointerDir = toLogical(e.clientX, e.clientY).x < W / 2 ? -1 : 1;
  }
  canvas.addEventListener('pointerdown', function (e) {
    audioCtx();                       // first user gesture: create the audio context lazily
    var p = toLogical(e.clientX, e.clientY);
    if (p.x >= MUTE_BTN.x && p.x <= MUTE_BTN.x + MUTE_BTN.w && p.y >= MUTE_BTN.y && p.y <= MUTE_BTN.y + MUTE_BTN.h) {
      toggleMute();
      return;
    }
    if (state.phase === 'paused') return;
    if (state.phase !== 'play') { advancePhase(); pointerDir = 0; return; }
    pointerFrom(e);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (pointerDir !== 0) pointerFrom(e);   // dragging across the halves switches direction
  });
  function pointerEnd() { pointerDir = 0; }
  canvas.addEventListener('pointerup', pointerEnd);
  canvas.addEventListener('pointercancel', pointerEnd);
  canvas.addEventListener('pointerleave', pointerEnd);
  window.addEventListener('resize', resize);
  window.addEventListener('blur', autoPause);
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('visibilitychange', function () { if (document.hidden) autoPause(); });
  }

  // ---- loop ----------------------------------------------------------------
  var last = null;
  function frame(now) {
    if (last === null) last = now;
    var dt = Math.min(MAX_DT, Math.max(0, (now - last) / 1000));
    last = now;
    step(dt);
    draw();
    window.requestAnimationFrame(frame);
  }

  // ---- test handle ---------------------------------------------------------
  window.__game = {
    W: W, H: H,
    state: state,
    keys: keys,
    view: view,
    step: step,
    difficulty: difficulty,
    setRandom: function (fn) { rand = fn || Math.random; },
    LINES: LINES,
    BUBBLE_TIME: BUBBLE_TIME,
    soundLog: soundLog,
    togglePause: togglePause,
    toggleMute: toggleMute,
    loadBest: loadBest,
    loseLife: loseLife,
    draw: draw,
    resize: resize,
    start: startGame,
    toLogical: toLogical
  };

  resize();
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
